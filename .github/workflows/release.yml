name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (leave empty to use version from CsMesh.csproj)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # Gate every release on the test suite. A tag push or manual dispatch must
  # never ship binaries for a tree the tests have not run against.
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore CsMesh.slnx

      - name: Build (Release)
        run: dotnet build CsMesh.slnx -c Release --no-restore

      - name: Run tests
        run: dotnet test src/tests/CsMesh.Tests/CsMesh.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

  build-aot:
    name: Build Native AOT (${{ matrix.target }})
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win-x64
            archive_name: csmesh-win-x64.zip
            binary_name: csmesh.exe
          - os: ubuntu-latest
            target: linux-x64
            archive_name: csmesh-linux-x64.tar.gz
            binary_name: csmesh
          - os: macos-latest
            target: osx-arm64
            archive_name: csmesh-osx-arm64.tar.gz
            binary_name: csmesh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Native AOT (${{ matrix.target }})
        run: >
          dotnet publish src/CsMesh/CsMesh.csproj
          -c Release
          -r ${{ matrix.target }}
          -p:PublishAot=true
          -p:AssemblyName=csmesh
          -o publish-out

      - name: Archive binary (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x publish-out/${{ matrix.binary_name }}
          tar -czf ${{ matrix.archive_name }} -C publish-out ${{ matrix.binary_name }}

      - name: Archive binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "publish-out/${{ matrix.binary_name }}" -DestinationPath "${{ matrix.archive_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}

  pack-nuget:
    name: Pack NuGet Package
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack .NET Tool
        run: dotnet pack src/CsMesh/CsMesh.csproj -c Release -o nupkg-out

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: nupkg-out/*.nupkg

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::Secret NUGET_API_KEY is missing! Please configure it in GitHub Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          dotnet nuget push nupkg-out/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  publish-release:
    name: Create GitHub Release
    needs: [build-aot, pack-nuget]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      # The install scripts (install.sh / install.ps1) verify the downloaded
      # archive against this file before extracting. Do not rename it without
      # updating the installers.
      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum csmesh-win-x64.zip csmesh-linux-x64.tar.gz csmesh-osx-arm64.tar.gz > checksums.txt
          cat checksums.txt

      - name: Determine Release Tag
        id: tag
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            VERSION=$(grep '<Version>' src/CsMesh/CsMesh.csproj | head -n1 | sed -E 's/.*<Version>([^<]+)<\/Version>.*/\1/' | tr -d ' \r\n')
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Using release tag: ${TAG}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: release-assets/*
          generate_release_notes: true
